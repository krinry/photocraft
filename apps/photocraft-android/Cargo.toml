[package]
name = "photocraft-android"
description = "PhotoCraft on Android (eframe wgpu runner via android-activity)"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
dbg_macro = "warn"
todo = "warn"

[lib]
crate-type = ["cdylib", "rlib"]
name = "photocraft_android"
path = "src/lib.rs"

[features]
default = []
# Open HEIC/HEIF photos (optional photocraft-heif crate)
heif = ["photocraft-codecs/heif"]

[dependencies]
photocraft-doc = { workspace = true }
photocraft-engine = { workspace = true }
photocraft-codecs = { workspace = true }
photocraft-io = { workspace = true }
photocraft-ui-egui = { workspace = true }
egui = { workspace = true }
log = { workspace = true }

[target.'cfg(target_os = "android")'.dependencies]
eframe = { workspace = true, features = ["default_fonts", "wgpu", "accesskit", "android-native-activity"] }
android-activity = { version = "0.6", features = ["native-activity"] }

[package.metadata.android]
package = "ai.storyteller.photocraft"
apk_label = "PhotoCraft"

[package.metadata.android.sdk]
min_sdk_version = 26
target_sdk_version = 34

[package.metadata.android.signing.release]
path = "release.keystore"
keystore_password = "photocraft"
key_alias = "photocraft"
key_password = "photocraft"


