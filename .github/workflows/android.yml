name: Android Build

on:
  push:
    branches: [main, "feature/**", "android**"]
  pull_request:
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r26b

      - name: Install cargo-apk
        run: cargo install cargo-apk --locked

      - name: Install Android Platform
        run: |
          echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-36" "platforms;android-30" "build-tools;36.0.0"

      - name: Build APK (Release)
        run: |
          cargo apk build -p photocraft-android --target aarch64-linux-android --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: photocraft-android-apk
          path: target/aarch64-linux-android/release/apk/*.apk

